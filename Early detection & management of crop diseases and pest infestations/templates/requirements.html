{% extends 'base.html' %}{% block content %}<h1>Buyer requirements</h1><form method="post" class="card card-body row g-2 mb-3"><div class="col"><select name="crop_id" class="form-select">{% for c in crops %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></div><div class="col"><input name="required_quantity" type="number" step=".01" class="form-control" placeholder="Quantity" required></div><div class="col"><select name="min_quality_grade" class="form-select"><option>A</option><option>B</option><option>C</option></select></div><div class="col"><input name="max_price" type="number" step=".01" class="form-control" placeholder="Maximum price"></div><div class="col"><input name="delivery_location" class="form-control" placeholder="Delivery location"></div><div class="col"><button class="btn btn-success">Create</button></div></form><table class="table"><tr><th>Crop</th><th>Quantity</th><th>Grade</th><th>Max price</th><th>Status</th></tr>{% for x in requirements %}<tr><td>{{x.crop.name}}</td><td>{{x.required_quantity}} {{x.unit}}</td><td>{{x.min_quality_grade}}</td><td>{{x.max_price}}</td><td>{{x.status}}</td></tr>{% endfor %}</table>{% endblock %}
