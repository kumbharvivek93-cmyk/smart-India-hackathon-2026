{% extends 'base.html' %}{% block content %}<h1>My crops</h1><form method="post" class="card card-body row g-2 mb-3"><div class="col"><select name="crop_id" class="form-select" required>{% for c in crops %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></div><div class="col"><input name="variety" class="form-control" placeholder="Variety"></div><div class="col"><input type="number" step=".01" name="area" class="form-control" placeholder="Area"></div><div class="col"><input type="number" step=".01" name="expected_quantity" class="form-control" placeholder="Expected quantity" required></div><div class="col"><button class="btn btn-success">Add crop</button></div></form><table class="table"><tr><th>Crop</th><th>Variety</th><th>Area</th><th>Expected quantity</th></tr>{% for x in entries %}<tr><td>{{x.crop.name}}</td><td>{{x.variety}}</td><td>{{x.area}} {{x.area_unit}}</td><td>{{x.expected_quantity}}</td></tr>{% endfor %}</table>{% endblock %}
