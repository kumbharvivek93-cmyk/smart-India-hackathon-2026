<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | AgriLink</title>
</head>
<body>
  <h1>Login to AgriLink</h1>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul>
        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <form method="post" action="{{ url_for('login_user') }}">
    <label>
      Email
      <input type="email" name="email" required autocomplete="username">
    </label>
    <br>
    <label>
      Password
      <input type="password" name="password" required minlength="6" autocomplete="current-password">
    </label>
    <br>
    <button type="submit">Log in</button>
  </form>

  <p>New to AgriLink? <a href="{{ url_for('registration_user') }}">Create an account</a>.</p>
  <p><a href="{{ url_for('home') }}">Back to home</a></p>
</body>
</html>
